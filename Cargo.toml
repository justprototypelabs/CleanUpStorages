[package]
name = "cleanupstorages"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Reliable catalog + deduplication tool for messy external drives"
license = "AGPL-3.0-only"
repository = "https://github.com/justprototypelabs/CleanUpStorages"
readme = "README.md"
keywords = ["deduplication", "catalog", "backup", "storage", "blake3"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "cleanupstorages"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
blake3 = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
sysinfo = "0.30"
anyhow = "1"
thiserror = "1"
zip = "2"
# `compress` feature is needed only by tests, to build a .7z fixture in-process without shelling
# out to a 7-Zip binary CI does not have. The spec named `sevenz-rust`; that crate's last release
# was 0.6.1 in 2023, so this is the maintained fork. Cargo's MSRV-aware resolver already pins this
# to 0.10.x here, because 0.22.x declares rustc 1.93 and this project's rust-version is 1.82.
# Because this is a normal (not dev-) dependency, Cargo has no per-profile way to gate the feature
# to tests only -- `compress` ships the 7z ENCODER into the release binary too, even though nothing
# in src/ ever writes a .7z (extraction only reads/decodes one). That is a known, accepted cost, not
# an oversight: feature unification means splitting this into a dev-dependency-only `compress`
# would require a second, differently-featured `sevenz-rust2` entry, which Cargo does not support
# cleanly for a single crate at two versions/feature-sets. Revisit only if binary size becomes a
# real complaint.
sevenz-rust2 = { version = "0.10", features = ["compress"] }
image = "0.25"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }

# Windows-only: crisp (DPI-aware) native folder dialog, owned by the foreground window and
# re-centered on the monitor once it appears.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
